spec: 1
version: 0.2.1

name: product-launch-video
description: Make a 15 to 60 second launch video that tells a product's story. Researches the product and its audience, writes the arc, animates the product's flow with snapcn's Remotion components, cuts to real footage where it proves the point, and checks every frame. Returns the MP4 and an editable video/ project.

runner: opencode
model:
  id: anthropic/claude-opus-5-5
  routes:
    - provider: openrouter
      model: anthropic/claude-opus-5.5
runner_config: ./runner/opencode.json

instructions: ./instructions.md
skills:
  - ./skills/launch-video-workflow
  - ./skills/snapcn
  - ./skills/remotion-launch-video
  - ./skills/remotion-product-demo

tools:
  - node
  - ffmpeg
  - ffprobe
  - lvnew
  - lvadd
  - lvcapture
  - lvcheck

mcps: []
env: {}

requirements:
  os: [linux]
  cpu: 4
  memory_gb: 8
  disk_gb: 10

runtimes:
  docker:
    image:
      build: ./Dockerfile
      context: .
