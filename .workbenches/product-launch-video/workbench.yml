spec: 1
version: 0.4.0

name: product-launch-video
description: Make a 15 to 60 second product marketing video scored with music, as a launch, a feature announcement, a changelog, or a short explainer. Researches the product and its audience, locks the message and arc with you in text, shows a storyboard of the real scenes for notes, then animates the product's flow with snapcn's Remotion components, cuts to real footage where it proves the point, asks for the score from a music brief, masters the mix, and checks every frame. Returns the MP4 and an editable video/ project. Remotion requires a company licence for companies of four or more people.

runner: opencode
model:
  id: anthropic/claude-opus-5-5
  routes:
    - provider: openrouter
      model: anthropic/claude-opus-5.5
runner_config: ./runner/opencode.json

instructions: ./instructions.md
skills:
  - ./skills/launch-video-workflow
  - ./skills/snapcn
  - ./skills/remotion-launch-video
  - ./skills/remotion-product-demo
  - ./skills/remotion-best-practices

tools:
  - node
  - ffmpeg
  - ffprobe
  - lvnew
  - lvadd
  - lvcapture
  - lvcheck

mcps: []
env: {}

requirements:
  os: [linux]
  cpu: 4
  memory_gb: 8
  disk_gb: 10

runtimes:
  docker:
    image:
      build: ./Dockerfile
      context: .
