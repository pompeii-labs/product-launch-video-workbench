spec: 1
version: 0.3.0-trial.1

name: product-launch-video-score
description: "Variant C (cut to the music) of product-launch-video 0.3.0 for a solver trial: the score is briefed and chosen before the storyboard, beat timing is snapped to the track's bars, and cuts land on the beat using shot recipe cards."

runner: opencode
model:
  id: anthropic/claude-opus-5-5
  routes:
    - provider: openrouter
      model: anthropic/claude-opus-5.5
runner_config: ./runner/opencode.json

instructions: ./instructions.md
skills:
  - ./skills/launch-video-workflow
  - ./skills/snapcn
  - ./skills/remotion-launch-video
  - ./skills/remotion-product-demo
  - ./skills/remotion-best-practices
  - ./skills/shot-recipes

tools:
  - node
  - ffmpeg
  - ffprobe
  - lvnew
  - lvadd
  - lvcapture
  - lvcheck

mcps: []
env: {}

requirements:
  os: [linux]
  cpu: 4
  memory_gb: 8
  disk_gb: 10

runtimes:
  docker:
    image:
      build: ../product-launch-video/Dockerfile
      context: ../product-launch-video
